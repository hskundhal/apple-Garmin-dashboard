[project]
name = "health-activity-dashboard-apple-garmin"
version = "0.1.0"
description = "Combined Apple Health & Garmin Heart Timelines and Activity Dashboard"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "garminconnect==0.3.2",
    "httpx>=0.27.0",
    "lxml>=5.3.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pyarrow>=17.0.0",
    "python-dateutil>=2.9.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.34.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
